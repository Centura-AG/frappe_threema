[project]
name = "frappe_threema"
authors = [
    { name = "Centura AG", email = "info@centura.ch"}
]
description = "Threema Gateway API Integration for Frappe"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0" # Installed and managed by bench.
]

[project.urls]
Repository = "https://github.com/Centura-AG/frappe_threema"
Issues = "https://github.com/Centura-AG/frappe_threema/issues"

[build-system]
requires = ["flit_core >=4,<5"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
    "UP030",
    "UP031",
    "UP032",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
